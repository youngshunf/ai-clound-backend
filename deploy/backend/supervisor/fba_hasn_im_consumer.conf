[program:fba_hasn_im_consumer]
directory=/fba/backend
command=/usr/local/bin/python -m backend.app.hasn_im.consumer_worker run
user=root
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/fba/fba_hasn_im_consumer.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
