name: huanxing-observability

x-service-security: &service-security
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  networks:
    - observability
  logging:
    driver: local
    options:
      max-size: 20m
      max-file: '3'

services:
  alloy:
    <<: *service-security
    image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    user: '473:473'
    mem_limit: 512m
    cpus: 0.50
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    depends_on:
      - loki
      - prometheus
      - tempo
    ports:
      - '127.0.0.1:4317:4317'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${OBS_DATA_DIR:-/data2/huanxing-observability}/data/alloy:/var/lib/alloy

  grafana:
    <<: *service-security
    image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    user: '472:0'
    mem_limit: 512m
    cpus: 0.50
    depends_on:
      - loki
      - prometheus
      - tempo
    environment:
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_USER: huanxing_admin
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_SERVER_ROOT_URL: http://127.0.0.1:13000/
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_DEFAULT_THEME: light
    ports:
      - '127.0.0.1:13000:3000'
    secrets:
      - grafana_admin_password
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../dashboards:/etc/grafana/dashboards:ro
      - ${OBS_DATA_DIR:-/data2/huanxing-observability}/data/grafana:/var/lib/grafana

  loki:
    <<: *service-security
    image: grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc
    user: '10001:10001'
    mem_limit: 768m
    cpus: 0.75
    command:
      - -config.file=/etc/loki/loki.yml
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ${OBS_DATA_DIR:-/data2/huanxing-observability}/data/loki:/loki

  prometheus:
    <<: *service-security
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    user: '65534:65534'
    mem_limit: 768m
    cpus: 0.75
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=6GB
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      observability:
        ipv4_address: 172.24.0.2
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${OBS_DATA_DIR:-/data2/huanxing-observability}/data/prometheus:/prometheus

  tempo:
    <<: *service-security
    image: grafana/tempo:3.0.2@sha256:cda87c212d8c584dc0b89e337e7ed648a5100feb657e5d528480ee4fa03dbbe3
    user: '10001:10001'
    mem_limit: 768m
    cpus: 0.75
    command:
      - -target=all
      - -config.file=/etc/tempo/tempo.yml
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - ${OBS_DATA_DIR:-/data2/huanxing-observability}/data/tempo:/var/tempo

networks:
  observability:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
        - subnet: 172.24.0.0/24
          gateway: 172.24.0.1

secrets:
  grafana_admin_password:
    file: ${OBS_DATA_DIR:-/data2/huanxing-observability}/secrets/grafana_admin_password
