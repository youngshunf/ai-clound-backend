## 唤星生产 RabbitMQ 单节点配置。
## 容器使用 host network，因此三个服务端口在宿主机上也只绑定 loopback。

listeners.tcp.default = 127.0.0.1:5672
management.tcp.ip = 127.0.0.1
management.tcp.port = 15672
prometheus.tcp.ip = 127.0.0.1
prometheus.tcp.port = 15692

## 单节点不接受远程集群或远程 CLI 连接。
distribution.listener.interface = 127.0.0.1
distribution.listener.port_range.min = 25672
distribution.listener.port_range.max = 25672

## 容器最多使用 2 GiB；到达 1 GiB 时先对发布者施加流控。
vm_memory_high_watermark.absolute = 1Gi
disk_free_limit.absolute = 5GB

## 消息正文必须保持小型；大文件只能传 hasn://asset URI。
max_message_size = 1048576
frame_max = 131072
channel_max = 128
consumer_max_per_channel = 32
connection_max = 512
channel_max_per_node = 4096
vhost_max = 16
cluster_exchange_limit = 1024
cluster_queue_limit = 4096

## 允许最长三小时的真实长任务完成并 ACK，避免使用默认 30 分钟误杀。
consumer_timeout = 10800000
handshake_timeout = 10000
heartbeat = 60

default_queue_type = classic
collect_statistics_interval = 10000

## guest 只允许 loopback；bootstrap.sh 创建角色账号后会删除该账号。
loopback_users.guest = true

log.console = true
log.console.level = info
log.file = /var/log/rabbitmq/rabbit.log
log.file.level = info
log.file.rotation.size = 52428800
log.file.rotation.count = 10
